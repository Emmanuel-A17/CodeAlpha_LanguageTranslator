<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lingua — Traducteur</title>
  <meta name="description" content="Traducteur de langues moderne – CodeAlpha, Tâche 1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8l6 6"/><path d="M4 14l6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="M22 22l-5-10-5 10"/><path d="M14 18h6"/></svg>
      </span>
      <span class="brand-name">Lingua</span>
    </div>
    <button id="themeBtn" class="icon-btn" title="Changer de thème" aria-label="Changer de thème">
      <svg id="themeIcon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Traduisez <span class="gradient">instantanément</span></h1>
      <p>Plus de 80 langues, détection automatique, lecture vocale et copie en un clic.</p>
    </section>

    <section class="card" aria-label="Traducteur">
      <div class="lang-bar">
        <div class="select-wrap">
          <select id="sourceLang" aria-label="Langue source"></select>
        </div>
        <button id="swapBtn" class="swap-btn" title="Inverser les langues" aria-label="Inverser les langues">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h13l-4-4"/><path d="M17 17H4l4 4"/></svg>
        </button>
        <div class="select-wrap">
          <select id="targetLang" aria-label="Langue cible"></select>
        </div>
      </div>

      <div class="panels">
        <div class="panel">
          <textarea id="inputText" placeholder="Saisissez ou collez votre texte ici…" maxlength="5000" spellcheck="false"></textarea>
          <div class="panel-footer">
            <div class="tools">
              <button id="speakInBtn" class="icon-btn sm" title="Écouter" aria-label="Écouter le texte source">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
              </button>
              <button id="clearBtn" class="icon-btn sm" title="Effacer" aria-label="Effacer">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
              </button>
            </div>
            <span id="counter" class="counter">0 / 5000</span>
          </div>
        </div>

        <div class="panel output">
          <div id="outputText" class="output-text placeholder" aria-live="polite">La traduction apparaîtra ici</div>
          <div class="panel-footer">
            <div class="tools">
              <button id="speakOutBtn" class="icon-btn sm" title="Écouter la traduction" aria-label="Écouter la traduction" disabled>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
              </button>
              <button id="copyBtn" class="icon-btn sm" title="Copier" aria-label="Copier la traduction" disabled>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              </button>
            </div>
            <span id="detected" class="counter"></span>
          </div>
        </div>
      </div>

      <div class="actions">
        <button id="translateBtn" class="primary-btn">
          <span class="btn-label">Traduire</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
        <span class="hint">Astuce : <kbd>Ctrl</kbd> + <kbd>Entrée</kbd></span>
      </div>
    </section>

    <section class="history-section" id="historySection" hidden>
      <div class="history-head">
        <h2>Historique récent</h2>
        <button id="clearHistory" class="link-btn">Tout effacer</button>
      </div>
      <ul id="historyList" class="history-list"></ul>
    </section>
  </main>

  <footer class="footer">CodeAlpha · Artificial Intelligence Internship · Tâche 1 — Language Translation Tool</footer>

  <div id="toast" class="toast" role="status"></div>
  <script src="/static/script.js"></script>
</body>
</html>
