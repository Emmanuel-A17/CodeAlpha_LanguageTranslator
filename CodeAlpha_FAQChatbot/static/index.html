<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova Shop — Assistant FAQ</title>
  <meta name="description" content="Chatbot FAQ avec NLP et similarité cosinus – CodeAlpha, Tâche 2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/></svg>
      </span>
      <span class="brand-name">Nova Shop <small>Assistant FAQ</small></span>
    </div>
    <div class="top-actions">
      <button id="menuBtn" class="icon-btn menu-btn" title="Toutes les questions" aria-label="Afficher toutes les questions">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <button id="themeBtn" class="icon-btn" title="Changer de thème" aria-label="Changer de thème">
        <svg id="themeIcon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main class="layout">
    <aside class="faq-panel" id="faqPanel" aria-label="Toutes les questions">
      <div class="panel-title">
        <h2>Questions fréquentes</h2>
        <button id="closePanel" class="icon-btn sm close-panel" aria-label="Fermer">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="faqList" class="faq-list"></div>
    </aside>
    <div id="overlay" class="overlay"></div>

    <section class="chat-card" aria-label="Conversation">
      <div class="chat-head">
        <div class="bot-avatar" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01M9 17h6"/></svg>
        </div>
        <div class="head-info">
          <strong>Assistant Nova Shop</strong>
          <span class="status"><i class="dot" id="statusDot"></i><span id="statusText">Connexion…</span></span>
        </div>
        <button id="clearBtn" class="icon-btn sm" title="Nouvelle conversation" aria-label="Nouvelle conversation">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5"/></svg>
        </button>
      </div>

      <div id="messages" class="messages" aria-live="polite"></div>
      <div id="chips" class="chips"></div>

      <form id="chatForm" class="composer" autocomplete="off">
        <input id="messageInput" type="text" placeholder="Posez votre question…" maxlength="500" aria-label="Votre message" />
        <button id="sendBtn" class="send-btn" type="submit" aria-label="Envoyer">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>
        </button>
      </form>
    </section>
  </main>

  <footer class="footer">CodeAlpha · Artificial Intelligence Internship · Tâche 2 — Chatbot for FAQs</footer>

  <div id="toast" class="toast" role="status"></div>
  <script src="/static/script.js"></script>
</body>
</html>
